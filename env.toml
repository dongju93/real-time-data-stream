[database.connection]
host = "localhost"
port = 5432
database = "stock"

[database.credentials]
user = "<username>"
password = "<password>"

[kafka.connection]
# 앱은 호스트에서 실행되므로 브로커의 EXTERNAL 리스너(localhost:9094)로 접속한다.
# (docker-compose 의 broker:9092 는 컨테이너 네트워크 내부 전용)
bootstrap_servers = "localhost:9094"

[kafka.consumer]
# 실시간 tick fan-out 용 consumer group **base** 이름.
# load_kafka_settings() 가 `{base}-{hostname}-{pid}` 로 프로세스마다 유일화한다.
# multi-worker/replica 가 같은 group_id 를 공유하면 Kafka 가 파티션을 로드밸런싱해
# 로컬 ticker_router 가 일부 체결을 놓친다(인스턴스별 독립 group = 전체 토픽 수신).
group_id = "real-time-data-stream-realtime"
# 실시간 시세는 신규 체결만 의미가 있으므로 최신 오프셋부터 소비
auto_offset_reset = "latest"
# at-most-once 로 충분(유실보다 지연 최소화가 중요), 오프셋 자동 커밋
enable_auto_commit = true

[kafka.topics]
# Debezium topic.prefix=stock + public.stock_trades 테이블
stock_trades = "stock.public.stock_trades"

[stock_generator.market]
market_code = "NASDAQ"
currency_code = "USD"
trade_types = ["BUY", "SELL"]

[stock_generator.data_ranges]
price_min = 100.0
price_max = 500.0
volume_min = 1
volume_max = 1000
time_offset_min = 1.0
time_offset_max = 10.0

[stock_generator.generation]
default_batch_size = 1000
min_batch_size = 10
max_batch_multiplier = 10
distribution_seconds = 10

[stock_generator.tickers]
# 빅테크
big_tech = [
    "AAPL",
    "GOOGL",
    "MSFT",
    "AMZN",
    "TSLA",
    "NVDA",
    "META",
    "NFLX",
    "ADBE",
    "CRM",
]

# 금융
finance = ["JPM", "BAC", "WFC", "GS", "MS"]

# 소비재
consumer = ["KO", "PEP", "MCD", "SBUX", "NKE"]

# 헬스케어
healthcare = ["JNJ", "PFE", "UNH", "ABBV", "BMY"]

# 에너지
energy = ["XOM", "CVX", "COP", "SLB", "EOG"]

# 소매
retail = ["HD", "LOW", "WMT", "TGT", "COST"]

# 산업재
industrial = ["BA", "CAT", "MMM", "GE", "HON"]

# 핀테크/결제
fintech = ["V", "MA", "PYPL", "SQ", "AXP"]

# 통신/미디어
media = ["DIS", "CMCSA", "T", "VZ", "CHTR"]
