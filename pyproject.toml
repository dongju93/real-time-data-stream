[project]
name = "real-time-data-stream"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "asyncpg==0.31.0",
    "confluent-kafka==2.15.0",
    "fastapi[standard]==0.139.0",
    "numpy==2.5.1",
    "orjson==3.11.9",
    "uuid-utils==0.16.2",
]

[tool.pyrefly]
project-includes = ["**/*.py*", "**/*.ipynb"]

[tool.pytest.ini_options]
# 루트의 env.toml 이 cwd 상대 경로로 로드되고(utils/config_loader.py),
# 패키지 미설치 상태에서 `import realtime` 이 되려면 프로젝트 루트가
# sys.path 에 있어야 한다. 항상 저장소 루트에서 `uv run pytest` 로 실행할 것.
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = ["pytest==9.1.1"]
